<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="3; url=$(link-redirect)">
<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="expires" content="-1">
<title>Hot Coffee — Connected</title>
<style>
  :root { --bg:#f6efe6; --card:#fffaf4; --ink:#2b1d14; --muted:#7a6656; --accent:#b5562b; --line:#e6d6c4; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh; background: var(--bg); color: var(--ink);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 24px 16px;
  }
  .card {
    width: 100%; max-width: 380px; text-align: center;
    background: var(--card); border: 1px solid var(--line); border-radius: 20px;
    padding: 28px 24px 22px; box-shadow: 0 10px 30px rgba(43,29,20,.08);
  }
  .card svg { width: 72px; height: 72px; }
  h1 { margin: 10px 0 4px; font-size: 24px; }
  p { margin: 6px 0; color: var(--muted); }
  a { color: var(--accent); font-weight: 600; }
  .links { margin-top: 18px; font-size: 14px; }
</style>
<script>
  function go() {
    $(if popup == 'true')
    open('$(link-status)', 'hotspot_status', 'toolbar=0,location=0,directories=0,status=0,menubars=0,resizable=1,width=380,height=420');
    $(endif)
    location.href = unescape('$(link-redirect-esc)');
  }
</script>
</head>
<body onload="setTimeout(go, 1500)">
<main class="card">
  <svg viewBox="0 0 64 64" aria-hidden="true">
    <circle cx="32" cy="32" r="31" fill="#2b1d14"/>
    <path d="M18 28h24v10a10 10 0 0 1-10 10h-4a10 10 0 0 1-10-10z" fill="#f6efe6"/>
    <path d="M42 31h3a5 5 0 0 1 0 10h-3" fill="none" stroke="#f6efe6" stroke-width="3"/>
    <path d="M25 14c-3 4 3 6 0 10M32 12c-3 4 3 6 0 10M39 14c-3 4 3 6 0 10" fill="none" stroke="#b5562b" stroke-width="2.5" stroke-linecap="round"/>
  </svg>
  <h1>You're connected</h1>
  <p>Enjoy your coffee and the Wi-Fi.</p>
  <p>Taking you to your page…</p>
  <div class="links">
    <a href="$(link-redirect)">Continue now</a> · <a href="$(link-status)">Session status</a>
  </div>
</main>
</body>
</html>
