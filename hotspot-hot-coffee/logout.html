<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="expires" content="-1">
<title>Hot Coffee — Disconnected</title>
<style>
  :root { --bg:#f6efe6; --card:#fffaf4; --ink:#2b1d14; --muted:#7a6656; --accent:#b5562b; --accent-ink:#fff; --line:#e6d6c4; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh; background: var(--bg); color: var(--ink);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 24px 16px;
  }
  .card {
    width: 100%; max-width: 380px;
    background: var(--card); border: 1px solid var(--line); border-radius: 20px;
    padding: 28px 24px 22px; box-shadow: 0 10px 30px rgba(43,29,20,.08);
  }
  .brand { text-align: center; margin-bottom: 16px; }
  .brand svg { width: 56px; height: 56px; }
  h1 { margin: 8px 0 2px; font-size: 22px; }
  .brand p { margin: 0; color: var(--muted); font-size: 15px; }
  dl { margin: 0 0 18px; display: grid; grid-template-columns: auto 1fr; gap: 8px 12px; font-size: 14px; }
  dt { color: var(--muted); }
  dd { margin: 0; text-align: right; }
  .btn {
    display: block; width: 100%; padding: 14px 16px; border: 0; border-radius: 12px;
    font: inherit; font-weight: 600; cursor: pointer;
    background: var(--accent); color: var(--accent-ink);
  }
  .note { text-align: center; font-size: 12px; color: var(--muted); margin-top: 14px; }
</style>
<script>
  function openLogin() {
    if (window.name != 'hotspot_logout') return true;
    open('$(link-login)', '_blank', '');
    window.close();
    return false;
  }
</script>
</head>
<body>
<main class="card">
  <div class="brand">
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <circle cx="32" cy="32" r="31" fill="#2b1d14"/>
      <path d="M18 28h24v10a10 10 0 0 1-10 10h-4a10 10 0 0 1-10-10z" fill="#f6efe6"/>
      <path d="M42 31h3a5 5 0 0 1 0 10h-3" fill="none" stroke="#f6efe6" stroke-width="3"/>
      <path d="M25 14c-3 4 3 6 0 10M32 12c-3 4 3 6 0 10M39 14c-3 4 3 6 0 10" fill="none" stroke="#b5562b" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
    <h1>You're disconnected</h1>
    <p>Thanks for stopping by!</p>
  </div>

  <dl>
    <dt>Session time</dt><dd>$(uptime)</dd>
    $(if session-time-left)
    <dt>Time left</dt><dd>$(session-time-left)</dd>
    $(endif)
    <dt>Uploaded / downloaded</dt><dd>$(bytes-in-nice) / $(bytes-out-nice)</dd>
    <dt>IP address</dt><dd>$(ip)</dd>
    <dt>MAC address</dt><dd>$(mac)</dd>
  </dl>

  <form action="$(link-login)" name="login" onsubmit="return openLogin()">
    <button class="btn" type="submit">Connect again</button>
  </form>

  <p class="note">Hot Coffee · Wi-Fi for our guests</p>
</main>
</body>
</html>
